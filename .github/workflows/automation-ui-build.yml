name: Allow all feedback validation

on:
  push:
    branches:
      - experiment/allow-all-feedback-20261122

permissions:
  contents: read

jobs:
  client-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PNPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      PNPM_CONFIG_FROZEN_LOCKFILE: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 12.16.0
          standalone: true
      - name: Check pinned tools
        run: |
          node --version
          test "$(pnpm --version)" = "12.16.0"
      - name: Restore public dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libkrb5-dev libx11-dev libxkbfile-dev
          pnpm install --frozen-lockfile --registry https://registry.npmjs.org/
      - name: Build client
        id: clientbuild
        run: pnpm run build-fast --client-only
      - name: Install test browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Typecheck source
        id: typecheck
        continue-on-error: true
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm run typecheck-client --pretty false > typecheck.log 2>&1
      - name: Lint Allow all changes
        id: lint
        continue-on-error: true
        run: |
          git fetch --depth=1 origin 733a99842b0e0e14c3593dfab31fff2035478ba0
          git diff --name-only 733a99842b0e0e14c3593dfab31fff2035478ba0 -- src/vs/workbench | grep '\.ts$' | xargs -r node build/oxlint.ts > lint.log 2>&1
      - name: Lint permission CSS
        id: csslint
        continue-on-error: true
        run: node build/stylelint.ts src/vs/workbench/contrib/chat/browser/widget/input/media/chatInputPicker.css > csslint.log 2>&1
      - name: Validate permission controls
        id: permissiontests
        continue-on-error: true
        env:
          VSCODE_AUTOMATION_SCREENSHOT_PHASE: after
        run: |
          printf '%s\n' \
            src/vs/workbench/contrib/chat/test/browser/widget/input/permissionPickerActionItem.test.ts \
            src/vs/workbench/contrib/chat/test/browser/agentSessions/agentHostChatInputPicker.test.ts \
            src/vs/workbench/contrib/sessions/providers/agentHost/test/browser/agentHostModePicker.test.ts > permission-tests.txt
          node test/unit/browser/index.js --runList permission-tests.txt --browser chromium --grep "Allow all shortcut|PermissionPickerActionItem|policy|warning|read.only|cloud drafts reuse|split controls have symmetric padding" --tfs allow-all
      - name: Capture patched permission widget
        id: screenshot
        continue-on-error: true
        env:
          VSCODE_AUTOMATION_SCREENSHOT_PHASE: after
        run: |
          node test/unit/browser/index.js --run src/vs/workbench/contrib/sessions/providers/agentHost/test/browser/agentHostModePicker.test.ts --browser chromium --grep "Allow all screenshot fixture" --tfs allow-all-screenshot
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: allow-all-feedback-validation
          path: |
            test-results
            screenshots
            typecheck.log
            lint.log
            csslint.log
          retention-days: 7
          if-no-files-found: warn
      - name: Require validation success
        if: always()
        run: |
          test "${{ steps.typecheck.outcome }}" = success
          test "${{ steps.lint.outcome }}" = success
          test "${{ steps.csslint.outcome }}" = success
          test "${{ steps.permissiontests.outcome }}" = success
          test "${{ steps.screenshot.outcome }}" = success
